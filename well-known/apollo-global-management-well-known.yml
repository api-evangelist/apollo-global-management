generated: '2026-09-04'
method: probed
source: >-
  Direct HTTP probes of the named /.well-known/ path list against every host the record
  knows: the registrable domain (apollo.com) and www, the investor-relations host
  (ir.apollo.com), the API host discovered by subdomain resolution (api.apollo.com), the
  two client/investor portal hosts (client.apollo.com, investor.apollo.com) and the
  research/education site (apolloacademy.com). Status is the HTTP code observed at fetch
  time on 2026-09-04.
description: >-
  Apollo Global Management publishes no security.txt and no api-catalog anywhere on its
  estate. It DOES publish a live OAuth 2.0 / OpenID Connect discovery surface on
  api.apollo.com, and that surface is MCP-shaped: the authorization, token and dynamic
  client registration endpoints all sit under /mcp/, and
  /.well-known/oauth-protected-resource/mcp returns an RFC 9728 protected-resource
  document naming https://api.apollo.com/mcp as the protected resource. None of this is
  documented on any public Apollo page — it was found by probe. See
  mcp/apollo-global-management-mcp.yml.
notes:
  - >-
    www.apollo.com returns a hard 404 with a real 404 page for every probed path — a clean
    negative, not a soft-404.
  - >-
    investor.apollo.com answers 200 with a 2,744-byte React SPA shell for EVERY path,
    including /openapi.json and /llms.txt. Those are recorded as 200 but are NOT documents
    and nothing was saved from them.
  - >-
    client.apollo.com is CloudFront over S3: absent keys return 403 AccessDenied. One path
    is a real document — /.well-known/oauth-protected-resource — but it declares the
    resource `api://vega-mcp` behind apolloid.okta.com. That application is Vega AltOS, a
    third-party private-markets client-service platform in which Apollo is an investor and
    anchor client (Apollo press release, 2024-11-12). The document is saved for the record
    and explicitly NOT credited to Apollo as a first-party contract.
