description: >-
  Apollo Global Management (NYSE: APO) is a global alternative asset manager and
  retirement services provider, running private equity, credit and real assets strategies
  for institutional investors, family offices and global wealth channels, with over $840
  billion in assets under management. Apollo runs no public developer program: it
  publishes no OpenAPI, GraphQL schema, AsyncAPI, SDK, developer portal or API
  documentation of any kind, and a full enumeration of its 4,784-URL sitemap contains no
  /api or /developer path. It does operate one machine-readable surface that was found by
  probe rather than by documentation — an OAuth 2.0 authorization server on api.apollo.com
  whose authorization, token and dynamic client registration endpoints sit under /mcp/,
  fronting a Model Context Protocol resource declared at
  https://api.apollo.com/.well-known/oauth-protected-resource/mcp. That endpoint is
  undocumented and not anonymously routable, so its tool surface is unknown.
apis:
  - name: Apollo MCP Server
    description: >-
      An undocumented Model Context Protocol server operated by Apollo Global Management
      on its own API host. Its existence is established by two first-party discovery
      documents fetched on 2026-09-04: RFC 8414 authorization server metadata at
      https://api.apollo.com/.well-known/oauth-authorization-server, whose issuer is
      https://api.apollo.com and whose authorize/token/register endpoints are namespaced
      under /mcp/, and RFC 9728 protected resource metadata at
      https://api.apollo.com/.well-known/oauth-protected-resource/mcp naming
      https://api.apollo.com/mcp as the protected resource. Access is authorization-code
      with PKCE S256 as a public client, with open dynamic client registration. Anonymous
      GET and POST to the endpoint return HTTP 404 at the edge rather than a 401
      challenge, so no tools/list response was obtainable and the tool surface is not
      recorded anywhere in this repository.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/apollo-global-management.png
    humanURL: https://www.apollo.com/
    baseURL: https://api.apollo.com/mcp
    tags:
      - MCP
      - Agents
      - Asset Management
    properties:
